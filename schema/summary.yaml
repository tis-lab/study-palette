id: https://w3id.org/tis-lab/study-palette/summary
name: study_palette_summary
title: Study Palette summary statistics
description: Class-first summaries of a meta-analysis study. Each concept or value appears once, with counts for
  each contributing study. Summary IDs remain stable within a release. Filter determines who is counted; focus determines
  which concepts are described. Age and demographics are always summarized. The overview has no filter or focus
  and supplies the unfiltered study denominators. Where a released participant_count is present on the response
  or a facet, clients use it; they never sum counts whose count_mode is OBFUSCATED. Sums of exact study counts are
  study-participant counts, not a distinct-person union across studies. Omitted or suppressed contributions are
  not zero. Race values can overlap. Repeated measurements use the most recent value; ontology rollups remain out
  of scope. Summary classes extend BDCHM, and participant-level records remain separate.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  palette: https://w3id.org/tis-lab/study-palette/
default_prefix: palette
default_range: string
imports:
- linkml:types
- ../synthetic/bdchm
- terms
classes:
  Summary:
    mixin: true
    description: A facet or value with per-study contributions and a stable summary ID.
    slots:
    - id
    - record_count
    - values
    - studies
    - participant_count
    - count_mode
    - outside_scope
  Binned:
    mixin: true
    description: A bin [bin_low, bin_high); either end may be left open.
    slots:
    - bin_low
    - bin_high
    - bin_unit
  ParticipantSummary:
    is_a: Participant
    mixins:
    - Summary
    - Binned
    description: Participants by age_at_index, binned.
    slots:
    - summarized_slot
    slot_usage:
      associated_person:
        required: false
      member_of_research_study:
        required: false
      values:
        range: ParticipantSummary
    rules:
    - &id005
      preconditions:
        slot_conditions:
          participant_count:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          count_mode:
            required: true
  DemographySummary:
    is_a: Demography
    mixins:
    - Summary
    description: Participants by sex, race, or ethnicity.
    slots:
    - summarized_slot
    slot_usage:
      associated_participant:
        required: false
      values:
        range: DemographySummary
    rules:
    - *id005
  ConditionSummary:
    is_a: Condition
    mixins:
    - Summary
    description: Participants with a condition recorded, by condition_status.
    slot_usage:
      associated_participant:
        required: false
      condition_provenance:
        required: false
      condition_status:
        required: false
      relationship_to_participant:
        required: false
      values:
        range: ConditionSummary
    rules:
    - *id005
  ProcedureSummary:
    is_a: Procedure
    mixins:
    - Summary
    description: Participants with a procedure recorded, by procedure_status.
    slot_usage:
      associated_participant:
        required: false
      procedure_provenance:
        required: false
      procedure_status:
        required: false
      values:
        range: ProcedureSummary
    rules:
    - *id005
  DrugExposureSummary:
    is_a: DrugExposure
    mixins:
    - Summary
    description: Participants with a drug exposure recorded.
    slot_usage:
      associated_participant:
        required: false
      exposure_provenance:
        required: false
      values:
        range: DrugExposureSummary
    rules:
    - *id005
  MeasurementObservationSummary:
    is_a: MeasurementObservation
    mixins:
    - Summary
    - Binned
    description: Participants with a measurement recorded, by bin of value_quantity. range_low and range_high keep
      their BDCHM meaning (a lab's reference range) and are not bins.
    slot_usage:
      associated_participant:
        required: false
      values:
        range: MeasurementObservationSummary
    rules:
    - *id005
  StudySummary:
    description: Matching participant count for one BDCHM ResearchStudy. On the unfiltered overview this is the
      study denominator; name is an optional display label.
    slots:
    - research_study
    - name
    - participant_count
    - count_mode
    - count_status
    - consent_group
    rules:
    - preconditions:
        slot_conditions:
          count_status:
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          participant_count:
            required: true
    - &id001
      preconditions:
        slot_conditions:
          count_status:
            equals_string: REPORTED
      postconditions:
        slot_conditions:
          participant_count:
            required: true
          count_mode:
            required: true
    - &id002
      preconditions:
        slot_conditions:
          count_status:
            equals_string: LISTED
      postconditions:
        slot_conditions:
          participant_count:
            value_presence: ABSENT
    - &id003
      preconditions:
        slot_conditions:
          count_status:
            equals_string: BELOW_MIN_COUNT
      postconditions:
        slot_conditions:
          participant_count:
            value_presence: ABSENT
    - &id004
      preconditions:
        slot_conditions:
          count_status:
            equals_string: WITHHELD
      postconditions:
        slot_conditions:
          participant_count:
            value_presence: ABSENT
  SummaryResponse:
    tree_root: true
    description: Class-first description of the participants matching the filter, with study totals and a term dictionary.
    slots:
    - release
    - focus
    - filter
    - min_count
    - terms
    - relations
    - research_studies
    - studies
    - records
    - seed
    - summary
    - suppressed_study_count
    - participant_count
    - count_mode
    - outside_scope
    slot_usage:
      studies:
        range: StudySummary
    rules:
    - *id005
  ParticipantRecords:
    description: Participant-level records, kept apart from summaries.
    attributes:
      record_conditions:
        description: Condition records.
        range: Condition
        multivalued: true
        inlined_as_list: true
      record_demographics:
        description: Demography records.
        range: Demography
        multivalued: true
        inlined_as_list: true
      record_measurements:
        description: MeasurementObservation records.
        range: MeasurementObservation
        multivalued: true
        inlined_as_list: true
  StudyContribution:
    description: Matching participants within one study for the containing facet or value.
    slots:
    - research_study
    - participant_count
    - count_mode
    - count_status
    - consent_group
    rules:
    - preconditions:
        slot_conditions:
          count_status:
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          participant_count:
            required: true
    - *id001
    - *id002
    - *id003
    - *id004
  OutsideScopeCount:
    description: The figure for consent groups outside the caller's exact scope, beside an exact figure for the groups
      inside it. It is computed and suppressed on its own and never combined with the exact figure, so a response with
      exact counts can still say something about the other groups without adding the two together.
    slots:
    - participant_count
    - count_mode
    - count_status
    - consent_group_count
    slot_usage:
      count_status:
        required: true
    rules:
    - *id001
    - *id003
    - *id004
  SummaryFacets:
    description: Class-based arrays. Omitted classes are unavailable; an empty array has no reportable entries.
    slots:
    - participants
    - demographics
    - conditions
    - procedures
    - drug_exposures
    - measurements
slots:
  participant_count:
    description: How many participants match. Required on study entries and contributions unless count_status says
      the count is listed, below min_count or withheld.
    range: integer
    required: false
    minimum_value: 0
  record_count:
    description: How many records match.
    range: integer
    minimum_value: 0
  values:
    description: The summary split by value. Each value repeats its parent's concept.
    range: Summary
    multivalued: true
    inlined: true
    inlined_as_list: true
  summarized_slot:
    description: The BDCHM slot summarized, for classes with no concept slot.
    range: SummarizedSlotEnum
    required: true
  bin_low:
    description: Lower bound, inclusive.
    range: decimal
  bin_high:
    description: Upper bound, exclusive.
    range: decimal
  bin_unit:
    description: Unit of the bounds, which may differ from the stored value's (ages are stored in days).
    range: UnitOfMeasurementEnum
  research_study:
    description: The study counted.
    range: ResearchStudy
    inlined: false
    required: true
  release:
    description: The index release counted. Responses merge only within a release.
    required: true
  focus:
    description: The concepts to describe. Each is summarized in every study that records it, along with the terms
      related to it. The filter, not the focus, decides who is counted. The overview has none.
    range: Term
    multivalued: true
    inlined: false
  filter:
    description: Ids of the summaries every participant counted must match. Each study's participant_count is how
      many of its participants pass.
    range: Summary
    multivalued: true
    inlined: false
  min_count:
    description: The smallest count reported. Smaller counts are left out.
    range: integer
    required: true
    minimum_value: 1
  terms:
    description: Term dictionary keyed by CURIE; the key supplies the Term identifier.
    range: Term
    multivalued: true
    inlined_as_list: false
    inlined: true
  relations:
    description: Links between terms beyond their hierarchy.
    range: TermRelation
    multivalued: true
    inlined_as_list: true
  research_studies:
    description: The studies counted.
    range: ResearchStudy
    multivalued: true
    inlined_as_list: true
  studies:
    description: Per-study contributions; the response root instead contains StudySummary entries.
    range: StudyContribution
    multivalued: true
    inlined_as_list: true
    inlined: true
  participants:
    range: ParticipantSummary
    multivalued: true
    inlined_as_list: true
  demographics:
    range: DemographySummary
    multivalued: true
    inlined_as_list: true
  conditions:
    range: ConditionSummary
    multivalued: true
    inlined_as_list: true
  procedures:
    range: ProcedureSummary
    multivalued: true
    inlined_as_list: true
  drug_exposures:
    range: DrugExposureSummary
    multivalued: true
    inlined_as_list: true
  measurements:
    range: MeasurementObservationSummary
    multivalued: true
    inlined_as_list: true
  records:
    description: Participant-level records, for callers authorized to see them.
    range: ParticipantRecords
    inlined: true
  seed:
    description: Optional legacy search-text echo. Focus identifies concepts; seed is absent for page load.
    range: string
    required: false
  name:
    description: Study display name when available.
    range: string
  summary:
    range: SummaryFacets
    inlined: true
    required: true
    description: Class-first facets for this response.
  suppressed_study_count:
    description: Number of matching studies omitted from the root study list because their counts are below min_count.
      This is not a participant count.
    range: integer
    minimum_value: 0
  count_mode:
    description: How the released participant count was produced. A label alone does not implement obfuscation.
    range: CountModeEnum
  count_status:
    description: Whether a count is reported or intentionally omitted.
    range: CountStatusEnum
  outside_scope:
    description: Participants in consent groups outside the caller's exact scope, counted apart from the exact figure.
    range: OutsideScopeCount
    inlined: true
  consent_group_count:
    description: How many consent groups the figure covers.
    range: integer
    minimum_value: 1
  consent_group:
    description: Stable consent-group identifier supplied by the authorized release; not inferred from a study ID.
    range: uriorcurie
enums:
  SummarizedSlotEnum:
    permissible_values:
      sex: null
      race: null
      ethnicity: null
      age_at_index: null
  CountModeEnum:
    permissible_values:
      EXACT:
        description: Exact count; release requires authorization for its full scope.
      OBFUSCATED:
        description: Count transformed by an approved disclosure method; the algorithm is not defined here.
  CountStatusEnum:
    permissible_values:
      REPORTED:
        description: A participant count is provided.
      LISTED:
        description: Study listed without a count.
      BELOW_MIN_COUNT:
        description: Count omitted because it is below the reporting threshold.
      WITHHELD:
        description: Count withheld by disclosure policy.
