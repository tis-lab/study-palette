id: https://w3id.org/tis-lab/study-palette/summary
name: study_palette_summary
title: Study Palette summary statistics
description: >-
  Study-level summaries of BDCHM-conformant data, built by extending the BDCHM
  classes themselves. A ConditionSummary is a Condition with the participant
  taken out and a count put in: it carries BDCHM's slots, ranges, and enums,
  so anything that reads a Condition reads a ConditionSummary, and moving from
  a summary to the records behind it is a filter on the same slot values.


  Shape. A response holds one StudySummary per study. In BDCHM a record
  reaches its study through associated_participant and then
  member_of_research_study; a summary has no participant, so the study is
  carried by the block it sits in. Within a block, each concept has one
  summary counting the participants with any value recorded for it, and that
  summary's values break the count down by value. Crosses between summaries
  are cells, which refer to summaries by id. The response lists the studies
  themselves as plain BDCHM ResearchStudy instances, since a study is already
  study-level and has no participant to take out.


  How to read a count:


  - A concept summary counts participants with at least one record of the
  concept, whatever its value. UNKNOWN is a recorded value with its own
  count, so recorded is not the same as known.

  - A value's count is out of its concept's. A participant is counted under
  every value one of their records carries, so values can overlap (absent
  before an incident diagnosis, present after) and need not sum to the
  concept.

  - Hierarchy rolls up for PRESENT and down for ABSENT. Present for a term
  is present for every ancestor; absent for a term is absent for every
  descendant, so a participant screened negative at the root of a hierarchy
  is recorded for every term beneath it. Counts of a term's children
  therefore overlap and need not sum to the term's own.

  - Measurement bins are facet buckets for selecting participants, not a
  distribution. Histograms are a separate query.

  - Counts are estimates. They are meant to be read as magnitudes, not
  reconciled to the participant.


  Identity. A summary's id is derived from its BDCHM slot values, never from
  its counts or its study, so the same question has the same id in every
  study and every response from a release. A count is keyed by the release,
  the response's cohort, the study, and the summary ids it names; responses
  for narrower cohorts are additive, merged by that key.


  A summary is a subclass of the BDCHM record it summarizes, so one placed
  where a record is expected passes validation. Summaries and
  participant-level records must therefore never share a slot or a table.
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  palette: https://w3id.org/tis-lab/study-palette/

default_prefix: palette
default_range: string

imports:
  - linkml:types
  - ../synthetic/bdchm
  - terms

classes:
  Summary:
    mixin: true
    description: >-
      What every summary carries, whichever BDCHM class it extends. Its id is
      required by BDCHM and must be derived from its slot values.
    slots:
      - id
      - participant_count
      - record_count
      - values

  Binned:
    mixin: true
    description: >-
      Restricts a summary to a half-open interval of one numeric value,
      [bin_low, bin_high). Either end may be absent for an open-ended bin. Which
      value is binned is fixed by the class that mixes this in.
    slots:
      - bin_low
      - bin_high
      - bin_unit

  ParticipantSummary:
    is_a: Participant
    mixins:
      - Summary
      - Binned
    description: >-
      Participants by age_at_index: recorded at the top, bins as its values.
      Study is not summarized here; it is the StudySummary.
    slots:
      - summarized_slot
    slot_usage:
      associated_person:
        required: false
      member_of_research_study:
        required: false
      values:
        range: ParticipantSummary

  DemographySummary:
    is_a: Demography
    mixins:
      - Summary
    description: >-
      Participants by one Demography slot, named by summarized_slot: recorded
      at the top, each value of the slot below. race is multivalued in BDCHM,
      so a participant recorded with two races is counted under each.
    slots:
      - summarized_slot
    slot_usage:
      associated_participant:
        required: false
      values:
        range: DemographySummary

  ConditionSummary:
    is_a: Condition
    mixins:
      - Summary
    description: Participants with a condition recorded, and by condition_status.
    slot_usage:
      associated_participant:
        required: false
      condition_provenance:
        required: false
      condition_status:
        required: false
      relationship_to_participant:
        required: false
      values:
        range: ConditionSummary

  ProcedureSummary:
    is_a: Procedure
    mixins:
      - Summary
    description: Participants with a procedure recorded, and by procedure_status.
    slot_usage:
      associated_participant:
        required: false
      procedure_provenance:
        required: false
      procedure_status:
        required: false
      values:
        range: ProcedureSummary

  DrugExposureSummary:
    is_a: DrugExposure
    mixins:
      - Summary
    description: Participants with a drug exposure recorded.
    slot_usage:
      associated_participant:
        required: false
      exposure_provenance:
        required: false
      values:
        range: DrugExposureSummary

  MeasurementObservationSummary:
    is_a: MeasurementObservation
    mixins:
      - Summary
      - Binned
    description: >-
      Participants with a measurement of observation_type, and by bins of
      value_quantity. range_low and range_high keep their BDCHM meaning, a
      laboratory's reference range, and are not bins.
    slot_usage:
      associated_participant:
        required: false
      values:
        range: MeasurementObservationSummary

  Cell:
    description: >-
      The participants in a study, within the response's cohort, matching
      every summary named: a cross-tabulation. A single summary's count is on
      the summary itself, so a cell always names at least two.
    slots:
      - criteria
      - participant_count
      - record_count

  StudySummary:
    description: >-
      Everything counted in one study. It refers to the study rather than
      extending it, because its counts depend on the response's cohort and
      the study does not.
    slots:
      - research_study
      - participant_count
      - participants
      - demographics
      - conditions
      - procedures
      - drug_exposures
      - measurements
      - cells
    slot_usage:
      participant_count:
        description: The number of the study's participants in the cohort.

  SummaryResponse:
    tree_root: true
    description: >-
      Counts around a seed term for one cohort, study by study, with the term
      graph connecting the concepts counted.
    slots:
      - release
      - seed
      - cohort
      - min_cell_count
      - max_cell_criteria
      - terms
      - relations
      - research_studies
      - studies
      - records

  ParticipantRecords:
    description: >-
      Participant-level records returned alongside summaries. Kept in their own
      class so that no slot holds both records and summaries.
    attributes:
      record_conditions:
        description: Participant-level Condition records.
        range: Condition
        multivalued: true
        inlined_as_list: true
      record_demographics:
        description: Participant-level Demography records.
        range: Demography
        multivalued: true
        inlined_as_list: true
      record_measurements:
        description: Participant-level MeasurementObservation records.
        range: MeasurementObservation
        multivalued: true
        inlined_as_list: true

slots:
  participant_count:
    description: Estimated number of distinct participants matching.
    range: integer
    required: true
    minimum_value: 0
  record_count:
    description: Estimated number of records matching.
    range: integer
    minimum_value: 0
  values:
    description: >-
      The summary broken down by value: the same concept, or the same
      summarized_slot, with one value set. Each value repeats its parent's
      concept so that it is a complete record on its own.
    range: Summary
    multivalued: true
    inlined: true
    inlined_as_list: true
  summarized_slot:
    description: >-
      The BDCHM slot a summary counts, for classes with no concept slot to say
      so. A summary leaving the slot unset counts participants with any value
      recorded for it.
    range: SummarizedSlotEnum
    required: true
  bin_low:
    description: Inclusive lower bound of the bin.
    range: decimal
  bin_high:
    description: Exclusive upper bound of the bin.
    range: decimal
  bin_unit:
    description: >-
      Unit of bin_low and bin_high, which need not be the unit the binned
      value is stored in; age_at_index is stored in days and binned in years.
    range: UnitOfMeasurementEnum
  criteria:
    description: Ids of the summaries a cell crosses, all of which must hold.
    range: Summary
    multivalued: true
    inlined: false
    required: true
    minimum_cardinality: 2
  research_study:
    description: The study a StudySummary counts.
    range: ResearchStudy
    inlined: false
    required: true
  release:
    description: >-
      The index release the counts come from. Counts merge across responses
      only within one release.
    required: true
  seed:
    description: The term the user searched on, which the rest of the response is organized around.
    range: Term
    inlined: false
    required: true
  cohort:
    description: >-
      Ids of the summaries selecting the cohort, all of which must hold. Each
      is defined in every study block, and every count is within it.
    range: Summary
    multivalued: true
    inlined: false
  min_cell_count:
    description: >-
      The smallest participant_count a summary or cell in this response may
      carry. Anything below it is omitted, so cross-tabulation stops where
      counts stop being meaningful estimates, and a larger cohort is
      cross-tabulated more deeply than a smaller one. An absent count is
      therefore either below this or a combination the response did not
      compute.
    range: integer
    required: true
    minimum_value: 1
  max_cell_criteria:
    description: >-
      The most summaries any cell in this response crosses. A size bound, not
      the stopping rule: min_cell_count decides how deep cross-tabulation
      goes, and this caps it. Deeper crosses come from a follow-up response.
    range: integer
    required: true
    minimum_value: 2
  terms:
    description: Every term the response refers to, so each CURIE resolves without a vocabulary lookup.
    range: Term
    multivalued: true
    inlined_as_list: true
  relations:
    description: Cross-links between terms, beyond each term's hierarchy.
    range: TermRelation
    multivalued: true
    inlined_as_list: true
  research_studies:
    description: The studies counted, as BDCHM ResearchStudy instances.
    range: ResearchStudy
    multivalued: true
    inlined_as_list: true
  studies:
    description: Counts, one block per study.
    range: StudySummary
    multivalued: true
    inlined_as_list: true
  participants:
    description: Summaries of age.
    range: ParticipantSummary
    multivalued: true
    inlined_as_list: true
  demographics:
    description: Summaries of sex, race, and ethnicity.
    range: DemographySummary
    multivalued: true
    inlined_as_list: true
  conditions:
    description: Summaries of conditions.
    range: ConditionSummary
    multivalued: true
    inlined_as_list: true
  procedures:
    description: Summaries of procedures.
    range: ProcedureSummary
    multivalued: true
    inlined_as_list: true
  drug_exposures:
    description: Summaries of drug exposures.
    range: DrugExposureSummary
    multivalued: true
    inlined_as_list: true
  measurements:
    description: Summaries of measurements.
    range: MeasurementObservationSummary
    multivalued: true
    inlined_as_list: true
  cells:
    description: Cross-tabulations among the study's summaries.
    range: Cell
    multivalued: true
    inlined_as_list: true
  records:
    description: Participant-level records, for a caller authorized to see them.
    range: ParticipantRecords
    inlined: true

enums:
  SummarizedSlotEnum:
    description: BDCHM slots summarized without a concept slot of their own.
    permissible_values:
      sex:
      race:
      ethnicity:
      age_at_index:
