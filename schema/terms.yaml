id: https://w3id.org/tis-lab/study-palette/terms
name: study_palette_terms
title: Study Palette term graph
description: >-
  The terms summaries refer to, their hierarchy, and the links between them.
  Built at ingestion and published with each release, so serving a summary
  never calls a vocabulary service.
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  palette: https://w3id.org/tis-lab/study-palette/
  biolink: https://w3id.org/biolink/vocab/

default_prefix: palette
default_range: string

imports:
  - linkml:types

classes:
  Term:
    description: A concept from a source vocabulary.
    slots:
      - curie
      - display_label
      - labels
      - vocabulary
      - parents

  TermLabel:
    description: One name a term goes by, and where it comes from.
    attributes:
      text:
        required: true
      label_source:
        range: LabelSourceEnum
        required: true
      synonym_scope:
        description: How close a synonym is to the term. Absent for the source's own name for it.
        range: SynonymScopeEnum

  TermRelation:
    description: A link between two terms outside their hierarchy, such as a disease and its biomarker.
    slots:
      - subject
      - predicate
      - object
      - relation_source

slots:
  curie:
    identifier: true
    range: uriorcurie
  display_label:
    description: >-
      What the UI shows: the CURATED name if there is one, otherwise the
      owning vocabulary's, otherwise the KG's, otherwise the CURIE. A name is
      a label without a synonym_scope; each source gives at most one.
    required: true
  labels:
    description: >-
      Every name the term goes by. Search matches on these, so a name users
      should be able to type belongs here. Empty when no source has a label;
      display_label is then the CURIE.
    range: TermLabel
    multivalued: true
    inlined_as_list: true
  vocabulary:
    description: >-
      The vocabulary that owns the term. Usually the CURIE's prefix, but an
      OMOP concept id wraps a term from another vocabulary, so OMOP:4156660 is
      SNOMED's.
  parents:
    description: Direct parents in the owning ontology. Children are the inverse, so are not stored.
    range: Term
    multivalued: true
    inlined: false
  subject:
    range: Term
    inlined: false
    required: true
  predicate:
    description: A Biolink predicate, e.g. biolink:has_biomarker.
    range: uriorcurie
    required: true
  object:
    range: Term
    inlined: false
    required: true
  relation_source:
    description: Where the link comes from, so a curated link never passes for a published one.
    range: RelationSourceEnum
    required: true

enums:
  RelationSourceEnum:
    permissible_values:
      KG:
        description: Published in the knowledge graph.
      CURATED:
        description: Asserted by this project.
  LabelSourceEnum:
    permissible_values:
      ONTOLOGY:
        description: Published by the vocabulary that owns the term.
      KG:
        description: From the BDC knowledge graph, including the variable library.
      CURATED:
        description: Chosen by this project, usually to replace a label users shouldn't have to read.
  SynonymScopeEnum:
    description: The OBO synonym scopes, which Monarch's search already distinguishes.
    permissible_values:
      EXACT:
      RELATED:
      BROAD:
      NARROW:
