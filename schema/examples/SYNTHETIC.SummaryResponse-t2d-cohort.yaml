# SYNTHETIC. Illustrative counts shaped like the synthetic corpus's two
# fictional studies; not derived from participant data and not computed from
# the corpus. Exists to show the schema can carry this response, not to
# report numbers.
#
# A user searched "type 2 diabetes". The cohort is participants with at least
# one fasting glucose measurement. Related terms come from the term graph:
# T2D's parent diabetes mellitus has fasting glucose as a curated biomarker,
# and the heart disorder subtree is offered for drill-down.

release: example-release
seed: MONDO:0005148
cohort:
  - palette:measurement/FAST_GLUC_BLD
min_cell_count: 10
max_cell_criteria: 2

terms:
  - curie: MONDO:0005148
    label: type 2 diabetes mellitus
    vocabulary: MONDO
    parents: [MONDO:0005015]
  - curie: MONDO:0005015
    label: diabetes mellitus
    vocabulary: MONDO
  - curie: MONDO:0005267
    label: heart disorder
    vocabulary: MONDO
  - curie: MONDO:0024643
    label: myocardial disorder
    vocabulary: MONDO
    parents: [MONDO:0005267]
  - curie: MONDO:0005068
    label: myocardial infarction
    vocabulary: MONDO
    parents: [MONDO:0024643]
  - curie: MONDO:0005252
    label: heart failure
    vocabulary: MONDO
    parents: [MONDO:0005267]
  - curie: MONDO:0001302
    label: hypertensive heart disease
    vocabulary: MONDO
    parents: [MONDO:0005267]
  - curie: OMOP:4156660
    label: Fasting blood glucose measurement
    vocabulary: SNOMED

relations:
  - subject: MONDO:0005015
    predicate: biolink:has_biomarker
    object: OMOP:4156660
    relation_source: CURATED

research_studies:
  - id: palette:study_one
    name: Example Study One
    research_project_type: STUDY
    program: Example Program
    principal_investigator: [Example Investigator]
  - id: palette:study_two
    name: Example Study Two
    research_project_type: STUDY
    program: Example Program
    principal_investigator: [Example Investigator]

