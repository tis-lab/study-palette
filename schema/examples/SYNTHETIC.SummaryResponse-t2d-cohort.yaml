# SYNTHETIC. Illustrative counts shaped like the synthetic corpus's two
# fictional studies; not derived from participant data and not computed from
# the corpus. Exists to show the schema can carry this response, not to
# report numbers.
#
# A user searched "type 2 diabetes". The cohort is participants with a
# recorded T2D status and at least one fasting glucose measurement. Related
# terms come from the term graph: T2D's parent diabetes mellitus has fasting
# glucose as a curated biomarker, and the heart disorder subtree is offered
# for drill-down.

release: example-release
seed: MONDO:0005148
cohort:
  - palette:condition/MONDO_0005148
  - palette:measurement/FAST_GLUC_BLD
participant_count: 940
min_cell_count: 10
max_cell_criteria: 2

terms:
  - curie: MONDO:0005148
    label: type 2 diabetes mellitus
    vocabulary: MONDO
    parents: [MONDO:0005015]
  - curie: MONDO:0005015
    label: diabetes mellitus
    vocabulary: MONDO
  - curie: MONDO:0005267
    label: heart disorder
    vocabulary: MONDO
  - curie: MONDO:0024643
    label: myocardial disorder
    vocabulary: MONDO
    parents: [MONDO:0005267]
  - curie: MONDO:0005068
    label: myocardial infarction
    vocabulary: MONDO
    parents: [MONDO:0024643]
  - curie: MONDO:0005252
    label: heart failure
    vocabulary: MONDO
    parents: [MONDO:0005267]
  - curie: MONDO:0001302
    label: hypertensive heart disease
    vocabulary: MONDO
    parents: [MONDO:0005267]
  - curie: OMOP:4156660
    label: Fasting blood glucose measurement
    vocabulary: SNOMED

relations:
  - subject: MONDO:0005015
    predicate: biolink:has_biomarker
    object: OMOP:4156660
    relation_source: CURATED

# Criteria: what a client can facet on. Each is defined once, and its id is
# derived from its values.

participants:
  - id: palette:participant/study/study_one
    member_of_research_study: palette:study_one
  - id: palette:participant/study/study_two
    member_of_research_study: palette:study_two
  - id: palette:participant/age/45-55a
    bin_low: 45
    bin_high: 55
    bin_unit: a
  - id: palette:participant/age/55-65a
    bin_low: 55
    bin_high: 65
    bin_unit: a
  - id: palette:participant/age/65-80a
    bin_low: 65
    bin_high: 80
    bin_unit: a

demographics:
  - id: palette:demography/sex/FEMALE
    sex: FEMALE
  - id: palette:demography/sex/MALE
    sex: MALE
  - id: palette:demography/race/WHITE
    race: [WHITE]
  - id: palette:demography/race/BLACK_OR_AFRICAN_AMERICAN
    race: [BLACK_OR_AFRICAN_AMERICAN]
  - id: palette:demography/race/ASIAN
    race: [ASIAN]
  - id: palette:demography/race/AMERICAN_INDIAN_OR_ALASKA_NATIVE
    race: [AMERICAN_INDIAN_OR_ALASKA_NATIVE]
  - id: palette:demography/race/MIDDLE_EASTERN_OR_NORTH_AFRICAN
    race: [MIDDLE_EASTERN_OR_NORTH_AFRICAN]
  - id: palette:demography/race/NATIVE_HAWAIIAN_OR_OTHER_PACIFIC_ISLANDER
    race: [NATIVE_HAWAIIAN_OR_OTHER_PACIFIC_ISLANDER]
  - id: palette:demography/ethnicity/HISPANIC_OR_LATINO
    ethnicity: HISPANIC_OR_LATINO
  - id: palette:demography/ethnicity/NOT_HISPANIC_OR_LATINO
    ethnicity: NOT_HISPANIC_OR_LATINO

conditions:
  # Status left unset: any recorded status. Part of the cohort.
  - id: palette:condition/MONDO_0005148
    condition_concept: MONDO:0005148
  - id: palette:condition/MONDO_0005148/PRESENT
    condition_concept: MONDO:0005148
    condition_status: PRESENT
  - id: palette:condition/MONDO_0005148/ABSENT
    condition_concept: MONDO:0005148
    condition_status: ABSENT
  - id: palette:condition/MONDO_0005267/PRESENT
    condition_concept: MONDO:0005267
    condition_status: PRESENT
  - id: palette:condition/MONDO_0024643/PRESENT
    condition_concept: MONDO:0024643
    condition_status: PRESENT
  - id: palette:condition/MONDO_0005068/PRESENT
    condition_concept: MONDO:0005068
    condition_status: PRESENT
  - id: palette:condition/MONDO_0005252/PRESENT
    condition_concept: MONDO:0005252
    condition_status: PRESENT
  - id: palette:condition/MONDO_0001302/PRESENT
    condition_concept: MONDO:0001302
    condition_status: PRESENT

measurements:
  # No bin: any measurement. Part of the cohort.
  - id: palette:measurement/FAST_GLUC_BLD
    observation_type: FAST_GLUC_BLD
  - id: palette:measurement/FAST_GLUC_BLD/-70mg_dL
    observation_type: FAST_GLUC_BLD
    bin_high: 70
    bin_unit: mg/dL
  - id: palette:measurement/FAST_GLUC_BLD/70-100mg_dL
    observation_type: FAST_GLUC_BLD
    bin_low: 70
    bin_high: 100
    bin_unit: mg/dL
  - id: palette:measurement/FAST_GLUC_BLD/100-126mg_dL
    observation_type: FAST_GLUC_BLD
    bin_low: 100
    bin_high: 126
    bin_unit: mg/dL
  - id: palette:measurement/FAST_GLUC_BLD/126-mg_dL
    observation_type: FAST_GLUC_BLD
    bin_low: 126
    bin_unit: mg/dL

cells:
  # One criterion: the high-level counts.
  - criteria: [palette:participant/study/study_one]
    participant_count: 470
  - criteria: [palette:participant/study/study_two]
    participant_count: 470
  - criteria: [palette:participant/age/45-55a]
    participant_count: 260
  - criteria: [palette:participant/age/55-65a]
    participant_count: 330
  - criteria: [palette:participant/age/65-80a]
    participant_count: 350
  - criteria: [palette:demography/sex/FEMALE]
    participant_count: 480
  - criteria: [palette:demography/sex/MALE]
    participant_count: 460
  - criteria: [palette:demography/race/WHITE]
    participant_count: 520
  - criteria: [palette:demography/race/BLACK_OR_AFRICAN_AMERICAN]
    participant_count: 250
  - criteria: [palette:demography/race/ASIAN]
    participant_count: 45
  - criteria: [palette:demography/race/AMERICAN_INDIAN_OR_ALASKA_NATIVE]
    participant_count: 45
  - criteria: [palette:demography/race/MIDDLE_EASTERN_OR_NORTH_AFRICAN]
    participant_count: 40
  - criteria: [palette:demography/race/NATIVE_HAWAIIAN_OR_OTHER_PACIFIC_ISLANDER]
    participant_count: 40
  - criteria: [palette:demography/ethnicity/HISPANIC_OR_LATINO]
    participant_count: 140
  - criteria: [palette:demography/ethnicity/NOT_HISPANIC_OR_LATINO]
    participant_count: 800
  # PRESENT and ABSENT overlap by the 20 participants diagnosed mid-study.
  - criteria: [palette:condition/MONDO_0005148/PRESENT]
    participant_count: 170
    record_count: 410
  - criteria: [palette:condition/MONDO_0005148/ABSENT]
    participant_count: 790
  # Heart disorder is rolled up over its descendants; its children overlap.
  - criteria: [palette:condition/MONDO_0005267/PRESENT]
    participant_count: 210
  - criteria: [palette:condition/MONDO_0024643/PRESENT]
    participant_count: 75
  - criteria: [palette:condition/MONDO_0005068/PRESENT]
    participant_count: 75
  - criteria: [palette:condition/MONDO_0005252/PRESENT]
    participant_count: 60
  - criteria: [palette:condition/MONDO_0001302/PRESENT]
    participant_count: 110
  # Bins overlap: a participant is in every bin a measurement falls in.
  - criteria: [palette:measurement/FAST_GLUC_BLD/-70mg_dL]
    participant_count: 35
  - criteria: [palette:measurement/FAST_GLUC_BLD/70-100mg_dL]
    participant_count: 690
  - criteria: [palette:measurement/FAST_GLUC_BLD/100-126mg_dL]
    participant_count: 420
  - criteria: [palette:measurement/FAST_GLUC_BLD/126-mg_dL]
    participant_count: 230

  # Two criteria: cross-tabulations, enough for one click without a request.
  - criteria: [palette:condition/MONDO_0005148/PRESENT, palette:demography/sex/FEMALE]
    participant_count: 78
  - criteria: [palette:condition/MONDO_0005148/PRESENT, palette:demography/sex/MALE]
    participant_count: 92
  - criteria: [palette:condition/MONDO_0005148/PRESENT, palette:condition/MONDO_0005267/PRESENT]
    participant_count: 65
  - criteria: [palette:condition/MONDO_0005148/PRESENT, palette:measurement/FAST_GLUC_BLD/126-mg_dL]
    participant_count: 120
  - criteria: [palette:condition/MONDO_0005267/PRESENT, palette:demography/sex/FEMALE]
    participant_count: 90
  - criteria: [palette:condition/MONDO_0005267/PRESENT, palette:demography/sex/MALE]
    participant_count: 120
  - criteria: [palette:measurement/FAST_GLUC_BLD/-70mg_dL, palette:demography/sex/FEMALE]
    participant_count: 20
  - criteria: [palette:measurement/FAST_GLUC_BLD/-70mg_dL, palette:demography/sex/MALE]
    participant_count: 15
  - criteria: [palette:measurement/FAST_GLUC_BLD/126-mg_dL, palette:demography/sex/FEMALE]
    participant_count: 100
  - criteria: [palette:measurement/FAST_GLUC_BLD/126-mg_dL, palette:demography/sex/MALE]
    participant_count: 130
  - criteria: [palette:participant/age/45-55a, palette:demography/sex/FEMALE]
    participant_count: 140
  - criteria: [palette:participant/age/45-55a, palette:demography/sex/MALE]
    participant_count: 120

# Participant-level records, for a caller authorized to see them. Never in
# the same slot as a criterion.
records:
  record_conditions:
    - id: palette:example/condition-1
      associated_participant: palette:example/participant-1
      condition_concept: MONDO:0005148
      condition_provenance: PATIENT_SELF_REPORT
      condition_status: PRESENT
      relationship_to_participant: ONESELF
  record_demographics:
    - id: palette:example/demography-1
      associated_participant: palette:example/participant-1
      sex: FEMALE
      race: [WHITE]
      ethnicity: NOT_HISPANIC_OR_LATINO
  record_measurements:
    - id: palette:example/glucose-1
      associated_participant: palette:example/participant-1
      observation_type: FAST_GLUC_BLD
      age_at_observation: 22280
      # value_quantity omitted: BDCHM v1.3.0 does not declare it inlined, so a
      # strict validator expects a Quantity id where real data nests the
      # Quantity. An upstream fix, not one to work around here.
