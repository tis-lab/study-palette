id: https://w3id.org/tis-lab/study-palette/summary-disclosure
name: study_palette_summary_disclosure
title: Draft summary disclosure extensions
description: Proposed disclosure metadata and optional released totals. Requires policy approval and enforcement
  outside the schema. Imports the canonical class-first contract.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  palette: https://w3id.org/tis-lab/study-palette/
default_prefix: palette
imports:
  - summary
classes:
  DisclosureStudyEntry:
    is_a: StudySummary
    slots:
      - count_mode
      - count_status
      - consent_group
    slot_usage:
      participant_count:
        required: false
      count_status:
        required: true
    rules:
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: REPORTED
        postconditions:
          slot_conditions:
            participant_count:
              required: true
            count_mode:
              required: true
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: LISTED
        postconditions:
          slot_conditions:
            participant_count:
              value_presence: ABSENT
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: BELOW_MIN_COUNT
        postconditions:
          slot_conditions:
            participant_count:
              value_presence: ABSENT
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: WITHHELD
        postconditions:
          slot_conditions:
            participant_count:
              value_presence: ABSENT
  DisclosureContribution:
    is_a: StudyContribution
    slots:
      - count_mode
      - count_status
      - consent_group
    slot_usage:
      participant_count:
        required: false
      count_status:
        required: true
    rules:
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: REPORTED
        postconditions:
          slot_conditions:
            participant_count:
              required: true
            count_mode:
              required: true
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: LISTED
        postconditions:
          slot_conditions:
            participant_count:
              value_presence: ABSENT
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: BELOW_MIN_COUNT
        postconditions:
          slot_conditions:
            participant_count:
              value_presence: ABSENT
      - preconditions:
          slot_conditions:
            count_status:
              equals_string: WITHHELD
        postconditions:
          slot_conditions:
            participant_count:
              value_presence: ABSENT
  DisclosureSummaryResponse:
    is_a: SummaryResponse
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureStudyEntry
      summary:
        range: DisclosureSummaryFacets
  DisclosureParticipantSummary:
    is_a: ParticipantSummary
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureContribution
      values:
        range: DisclosureParticipantSummary
  DisclosureDemographySummary:
    is_a: DemographySummary
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureContribution
      values:
        range: DisclosureDemographySummary
  DisclosureConditionSummary:
    is_a: ConditionSummary
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureContribution
      values:
        range: DisclosureConditionSummary
  DisclosureProcedureSummary:
    is_a: ProcedureSummary
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureContribution
      values:
        range: DisclosureProcedureSummary
  DisclosureDrugExposureSummary:
    is_a: DrugExposureSummary
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureContribution
      values:
        range: DisclosureDrugExposureSummary
  DisclosureMeasurementObservationSummary:
    is_a: MeasurementObservationSummary
    slots:
      - participant_count
      - count_mode
    slot_usage:
      participant_count:
        required: false
      count_mode:
        required: true
      studies:
        range: DisclosureContribution
      values:
        range: DisclosureMeasurementObservationSummary
  DisclosureSummaryFacets:
    is_a: SummaryFacets
    slot_usage:
      participants:
        range: DisclosureParticipantSummary
      demographics:
        range: DisclosureDemographySummary
      conditions:
        range: DisclosureConditionSummary
      procedures:
        range: DisclosureProcedureSummary
      drug_exposures:
        range: DisclosureDrugExposureSummary
      measurements:
        range: DisclosureMeasurementObservationSummary
slots:
  count_mode:
    description: How the released participant count was produced. A label alone does not implement obfuscation.
    range: CountModeEnum
  count_status:
    description: Whether a count is reported or intentionally omitted.
    range: CountStatusEnum
  consent_group:
    description: Stable consent-group identifier supplied by the authorized release; not inferred from a study ID.
    range: uriorcurie
enums:
  CountModeEnum:
    permissible_values:
      EXACT:
        description: Exact count; release requires authorization for its full scope.
      OBFUSCATED:
        description: Count transformed by an approved disclosure method; the algorithm is not defined here.
  CountStatusEnum:
    permissible_values:
      REPORTED:
        description: A participant count is provided.
      LISTED:
        description: Study listed without a count.
      BELOW_MIN_COUNT:
        description: Count omitted because it is below the reporting threshold.
      WITHHELD:
        description: Count withheld by disclosure policy.
