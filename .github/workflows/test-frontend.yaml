name: Test Frontend

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: ./ui

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint
