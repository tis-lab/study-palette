# Disclosure policy: what each tier may see at each stage, and how counts are protected.
# Data, not code. Reviewed and approved by the data access committees; every
# response records the policy version it was shaped under, in access.query_ledger.
#
# Structure and the meaning of every value: schema/policy.yaml (DisclosurePolicy).
# Summary schema: schema/summary.yaml. Profiles: schema/summary-profiles.yaml,
# generated by schema/generate_summary_profiles.py.
# Values marked "proposed" need committee approval before use with real data.
#
# Stages: 0 sign-in and scope, 1 search and add terms, 2 live summary per term,
# 3 And, Or and Not, 4 refine criteria, 5 cohort and visuals, 6 provisioning.
# Every stage lists available, pool and profile; "none" means none. An unavailable
# stage has no pool and no profile, and sets nothing else.

policy_version: 1
status: draft

counting:
  min_count: 10                             # changed only by issuing a new policy_version
  below_min_count_includes_zero: true
  identity_rule: Participant
  noise:
    distribution: UNIFORM_INTEGER           # proposed
    min: -3                                 # proposed
    max: 3                                  # proposed
    clamp_to_min_count: true
    seed_function: HMAC_SHA256
    seed_inputs: [RELEASE, MATCHED_PARTICIPANTS]
    # key_reference: the Key Vault key name; to be set before approval
  totals:
    method: UNION_THEN_OBFUSCATE
    include_below_min_count_studies: true
    exact_requires_full_exact_scope: true
  suppression:
    method: REMAINDER
    withhold_order: SMALLEST_FIRST
    fallback: WITHHOLD_PARENT
    parents: [CONTRIBUTIONS, FACET_VALUES]
    count_implied_not_recorded: true
  record_count_scope: EXACT_SCOPE_ONLY
  releases:
    retired_release_tiers: [authorized]
    retired_release_own_cohorts_only: true
    overlap_checks_span_releases: true

tiers:

  - name: public
    accountability: NONE
    limits:
      - limit_type: RATE_LIMIT              # flood protection only; a query budget could be added later
        amount: 60                          # proposed
        unit: REQUESTS
        period: MINUTE
        keyed_by: NETWORK_ADDRESS
    overlap_check:                          # applied across the fixed table when it is built
      scope: GLOBAL
      on_match: WITHHOLD
    stages:
      - number: 0
        available: false
        pool: none
        profile: none
      - number: 1
        available: true
        pool: api_search
        profile: none
        stigmatizing_terms: SHOWN_NOT_FILTERABLE
      - number: 2
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
      - number: 3
        available: true
        pool: api_public                    # read from the fixed table
        profile: TotalsSummaryResponse
        operators: [all]
        max_terms: 2                        # the fixed table holds every filter of up to two terms
      - number: 4                           # stage 2's summaries already carry the table's bins
        available: false
        pool: none
        profile: none
      - number: 5
        available: false
        pool: none
        profile: none
      - number: 6
        available: true
        pool: none
        profile: none
        provisioning: ACCESS_INFORMATION

  - name: authenticated
    accountability: RAS_ACCOUNT
    limits:
      - limit_type: QUERY_BUDGET
        amount: 500                         # proposed
        unit: QUERY_UNITS
        period: DAY
        keyed_by: ACCOUNT
    overlap_check:
      scope: PER_ACCOUNT
      on_match: REFUSE
    log_every_request: true
    stages:
      - number: 0
        available: true
        pool: none
        profile: none
      - number: 1
        available: true
        pool: api_search
        profile: none
        stigmatizing_terms: SHOWN_NOT_FILTERABLE
      - number: 2
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
      - number: 3
        available: true
        pool: api_counting                  # combining terms needs a live query
        profile: TotalsSummaryResponse      # output is still the public view
        operators: [all, any, none]
        max_terms: 20                       # proposed
        max_nesting: 3                      # proposed
      - number: 4
        available: true
        pool: api_counting                  # values and time need event rows
        profile: TotalsSummaryResponse      # output is still the public view
        numeric_ranges: MIN_ONE_BIN         # proposed
        temporal_windows: ALLOWED
        min_window_days: 30                 # proposed
      - number: 5                           # on a materialized cohort
        available: true
        pool: api_counting
        profile: BreakdownSummaryResponse
        charts: OBFUSCATED
        below_min_count_listing: ALL_UNREPORTED_CONSENT_GROUPS    # pending committee approval
      - number: 6
        available: true
        pool: none
        profile: none
        provisioning: PREFILLED_ACCESS_REQUEST

  - name: authorized
    accountability: RAS_ACCOUNT_WITH_VISAS
    exact_scope: ENTITLED_AND_ELIGIBLE
    limits:
      - limit_type: QUERY_BUDGET
        draws_on: authenticated
        exempt_within_exact_scope: true
    overlap_check:
      scope: PER_ACCOUNT
      on_match: REFUSE
    log_every_request: true
    stages:
      - number: 0
        available: true
        pool: none
        profile: none
      - number: 1
        available: true
        pool: api_search
        profile: none
        stigmatizing_terms: FILTERABLE_WITHIN_EXACT_SCOPE         # if the committees approve
      - number: 2
        available: true
        pool: api_counting                  # exact scope needs entitlements and eligibility
        profile: ExactTotalsSummaryResponse
      - number: 3
        available: true
        pool: api_counting
        profile: ExactTotalsSummaryResponse
        operators: [all, any, none]
        max_terms: 20                       # proposed
        max_nesting: 3                      # proposed
      - number: 4
        available: true
        pool: api_counting
        profile: ExactTotalsSummaryResponse
        numeric_ranges: RELAXED_WITHIN_EXACT_SCOPE                # if the committees agree
        temporal_windows: ALLOWED
        min_window_days: 30     # Window only applies outside of the users EXACT scope
      - number: 5
        available: true
        pool: api_counting
        profile: ExactBreakdownSummaryResponse
        charts: EXACT_WITHIN_EXACT_SCOPE
      - number: 6
        available: true
        pool: none
        profile: none
        provisioning: SHARE_AND_ACCESS_REQUEST

eligibility:                                # suggestions for curators; committees decide per consent group
  - {consent_modifier: COL, discovery_counts: ALLOW, exact_counts: DENY, sharing: DENY}
  - {consent_modifier: GSO, discovery_counts: REVIEW, exact_counts: DENY, sharing: REVIEW}
  - {consent_modifier: NPUNCU, discovery_counts: ALLOW, exact_counts: ALLOW, sharing: REVIEW}
# discovery_counts is proposed.
