# Disclosure policy: what each tier may see at each stage, and how counts are protected.
# Data, not code. Reviewed and approved by the data access committees; every
# response records the policy version it was shaped under, in access.query_ledger.
#
# Schema: tis-lab/study-palette, main branch: schema/summary.yaml.
# Profiles: schema/summary-profiles.yaml, generated by schema/generate_summary_profiles.py.
# Values marked "proposed" need committee approval before use with real data.
#
# Stages, as in the proposal:
#   0 sign-in and scope   1 search and add terms   2 live summary per term
#   3 And, Or and Not     4 refine criteria        5 cohort and visuals
#   6 provisioning
# Tiers: public (no sign-in); authenticated (signed in through NIH RAS); authorized
# (authenticated, with dbGaP approval for at least one consent group in the release;
# authorization covers only those groups). Profiles are named for what a response
# may contain: Totals, Breakdown, Exact.
# Each stage names the database role its queries run as (pool) and the profile
# its responses must pass. A stage with no profile returns no counts.
# Every stage lists available, pool and profile, with null meaning none. An unavailable
# stage has no pool and no profile, and carries no other keys.

policy_version: 5
status: draft

counting:
  min_count: 10                             # default; changed only by issuing a new policy_version
  below_min_count_includes_zero: true       # BELOW_MIN_COUNT reads "fewer than 10, possibly none"
  identity_rule: Participant                # one per enrollment; a person in two studies counts twice

  noise:
    applies_to: OBFUSCATED counts at or above min_count
    distribution: uniform whole number from -3 to +3     # proposed
    clamp: a noisy value below min_count is shown as min_count
    seed: >-
      HMAC-SHA256 over the release and the sorted matched participant numbers.
      Seeded by the participant set only, never by the cell's label, so the same
      participants always get the same noise wherever they appear.
    key: >-
      Held in Key Vault, one key version per release, read by the middleware.
      The policy records the key version, never the key.

  totals:
    method: >-
      Exact union over every study in scope, including studies below min_count,
      obfuscated once with its own seed. Never a sum of contributions.
    exact_only_if: every contributing consent group is in the caller's exact scope
    clients: use a released total where present; never add up OBFUSCATED counts

  suppression:
    remainder_rule: >-
      Wherever a reported parent appears with its parts, the amount a reader can
      derive from suppressed parts (parent minus reported parts) must itself be at
      least min_count. Otherwise withhold further parts (WITHHELD), smallest first,
      until it is; if that cannot be done, withhold the parent.
    parents: >-
      Totals over their study and consent-group contributions; and the cohort
      total over every facet's values, counting an implied "not recorded" part.

  record_count: only for cells entirely within the caller's exact scope

  releases: >-
    Public and authenticated users query the active release only. Retired releases
    stay available only to authorized researchers, for their own saved cohorts.
    Overlap checks compare queries across releases.

tiers:

  public:
    accountability: none
    rate_limit: 60 requests per minute per network address     # proposed
    stages:
      0_sign_in_and_scope:
        available: false
        pool: null
        profile: null
      1_search_and_add_terms:
        available: true
        pool: api_search
        profile: null
        allowed: term search through the BDC-KG; stigmatizing terms shown but not filterable
      2_live_summary_per_term:
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
        returns: >-
          OBFUSCATED total; contributing studies named with count_status LISTED and
          no counts, only at or above min_count; suppressed_study_count
      3_and_or_not:
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
        operators: [all]                    # And only
        max_terms: 5                        # proposed
      4_refine_criteria:
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
        numeric_ranges: on precomputed bin edges only
        temporal_windows: false
      5_cohort_and_visuals:
        available: false
        pool: null
        profile: null
      6_provisioning:
        available: true
        pool: null
        profile: null
        shows: information on how to request access

  authenticated:
    accountability: RAS account
    budget: 500 query units per day per account                # proposed
    overlap_check: >-
      Block a query whose matched set differs from an earlier one by fewer than
      min_count participants.
    stages:
      0_sign_in_and_scope:
        available: true
        pool: null
        profile: null
        sign_in: NIH RAS
        allowed: budget assigned
      1_search_and_add_terms:
        available: true
        pool: api_search
        profile: null
        allowed: term search through the BDC-KG; stigmatizing terms shown but not filterable
      2_live_summary_per_term:
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
        returns: same as public, drawing on the budget
      3_and_or_not:
        available: true
        pool: api_public
        profile: TotalsSummaryResponse
        operators: [all, any, none]
        max_terms: 20                       # proposed
        max_nesting: 3                      # proposed
      4_refine_criteria:
        available: true
        pool: api_counting                  # values and time need event rows
        profile: TotalsSummaryResponse      # output is still the public view
        numeric_ranges: minimum width of one bin of the facet's summary     # proposed
        temporal_windows: true
        min_window_days: 30                 # proposed
      5_cohort_and_visuals:                 # on a materialized cohort
        available: true
        pool: api_counting
        profile: BreakdownSummaryResponse
        returns: >-
          OBFUSCATED counts per study and consent group, each with a count_status;
          binned, suppressed charts, including co-occurrence and Sankey
        below_min_count_listing: >-         # pending committee approval
          every consent group in the release not otherwise reported, including those
          with no matches, as BELOW_MIN_COUNT
        record_count: absent
      6_provisioning:
        available: true
        pool: null
        profile: null
        shows: an access request prefilled from the cohort

  authorized:
    accountability: RAS account plus visa IDs
    exact_scope: entitled consent groups whose current eligibility allows exact counts
    budget: >-
      None for queries entirely within exact scope; queries touching other groups
      draw on the authenticated budget. Every request is logged.
    stages:
      0_sign_in_and_scope:
        available: true
        pool: null
        profile: null
        sign_in: NIH RAS
        allowed: exact scope computed from visas and shown up front
      1_search_and_add_terms:
        available: true
        pool: api_search
        profile: null
        allowed: stigmatizing terms usable within exact scope if the committees approve
      2_live_summary_per_term:
        available: true
        pool: api_counting                  # exact scope needs entitlements and eligibility
        profile: ExactSummaryResponse
        returns: >-
          Two figures, never combined: an EXACT count for groups in exact scope, and
          an OBFUSCATED count, computed and suppressed on its own, for all others
      3_and_or_not:
        available: true
        pool: api_counting
        profile: ExactSummaryResponse
        operators: [all, any, none]
        max_terms: 20                       # proposed
        max_nesting: 3                      # proposed
      4_refine_criteria:
        available: true
        pool: api_counting
        profile: ExactSummaryResponse
        numeric_ranges: authenticated minimums, relaxed within exact scope if the committees agree
        temporal_windows: true
      5_cohort_and_visuals:
        available: true
        pool: api_counting
        profile: ExactSummaryResponse
        returns: both views; exact charts within exact scope, never individual points
        record_count: only within exact scope
      6_provisioning:
        available: true
        pool: null                          # handled by the provisioning service, not the middleware
        profile: null
        shows: a share for entitled, eligible consent groups; an access request for the rest

eligibility:                                # decided per consent group by the committees
  decisions: [discovery_counts, exact_counts, sharing]   # discovery_counts is proposed
  modifier_defaults:                        # suggestions for curators; committees decide
    COL: {discovery_counts: true,  exact_counts: false, sharing: false}
    GSO: {discovery_counts: review, exact_counts: false, sharing: review}
    NPUNCU: {discovery_counts: true, exact_counts: true, sharing: review}
