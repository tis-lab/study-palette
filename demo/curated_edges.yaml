# Provisional disease -> measurement/procedure edges.
#
# WHY THIS FILE EXISTS
# No public knowledge graph connects a MONDO disease to an OBA or OMOP
# measurement: the vocabularies have no edges between them, and ontology
# hierarchy is is-a only, so walking it from a disease reaches other diseases
# and nothing else. Monarch supplies disease->disease and disease->phenotype
# edges, which the builder harvests. The edges below are the layer that does
# not exist anywhere yet and that Study Palette expects to curate.
#
# STATUS
# Authored for the demo. Every edge is a clinical assertion that has NOT been
# reviewed by a clinician. Directions are conventional rather than exhaustive:
# these are the investigations a study would routinely carry for the condition,
# not a diagnostic protocol. Treat as a starting point for curation, not a
# reference. The UI marks anything sourced here as "curated" so it is never
# mistaken for a harvested edge.
#
# PREDICATES
#   biolink:has_biomarker  a measurement that indicates or monitors the condition
#   biolink:diagnosed_by   a procedure or test used to establish or stage it
#
# Every object CURIE below is attested in the variable library, so each edge
# resolves to harmonized variables that real studies actually collect.

MONDO:0005252:                          # heart failure
  biolink:has_biomarker:
    - OBA:2045303                       # Natriuretic peptides B level
    - OBA:2050096                       # Serum creatinine amount
    - OBA:VT0005265                     # Blood urea nitrogen amount
    - OBA:VT0001776                     # Blood sodium amount
    - OMOP:37208635                     # Egfr
    - OMOP:4021291                      # Troponin
  biolink:diagnosed_by:
    - OBA:1001086                       # QRS duration
    - HP:0001712                        # Left ventricular hypertrophy
    - OMOP:4273023                      # Qt ekg
    - OMOP:45772840                     # Pacemaker status

